version: "3.8"

services:
  # Layanan Web untuk PHP 7.4
  web74:
    build: ./apache74
    image: trial-web:7.4
    container_name: apache_php_74
    restart: always
    ports:
      - "8074:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  # Layanan Web untuk PHP 8.3
  web83:
    build: ./apache83
    image: trial-web:8.3
    container_name: apache_php_83
    restart: always
    ports:
      - "8083:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    build: ./mysql
    image: mariadb:10.4.11
    container_name: mariadb_server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.0.1
    container_name: phpmyadmin_ui
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 512M
    depends_on:
      - db

volumes:
  mariadb_data:
